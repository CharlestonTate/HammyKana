<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hammy — Choose a course</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://db.onlinewebfonts.com/c/fb1fb17e0be5850598ac0f40e356bf77?family=DIN+Next+Rounded+LT+W01+Medium" rel="stylesheet">
</head>
<body class="course-hub-body">
  <main class="course-hub">
    <div class="course-hub-card">
      <img class="course-hub-mascot" src="/img/idle1.png" width="120" height="120" alt="Hammy the hamster">
      <h1 class="course-hub-title">HammyKana</h1>
      <p class="course-hub-subtitle">Pick a course to start learning.</p>
      <nav class="course-hub-actions" aria-label="Course selection">
        <a class="course-hub-button" href="/japanese/" data-course-entry="japanese">
          <span class="course-hub-button-label">Japanese</span>
          <span class="course-hub-button-hint">Hiragana &amp; katakana</span>
        </a>
        <a class="course-hub-button" href="/telugu/" data-course-entry="telugu">
          <span class="course-hub-button-label">Telugu</span>
          <span class="course-hub-button-hint">Telugu alphabet</span>
        </a>
      </nav>
    </div>
  </main>
  <script src="/js/assets.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/hub.js"></script>
</body>
</html>
